name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Not real credentials — the build never connects to either
          # service (all routes are force-dynamic, so DB/AI calls only
          # happen per-request at runtime, never during static build
          # analysis). These just satisfy the "is this env var set at
          # all" guard checks in lib/db/index.ts and lib/ai/gemini.ts.
          DATABASE_URL: postgresql://ci:ci@ci.invalid/ci
          GEMINI_API_KEY: ci-placeholder-key
